name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build the wheel
        run: ./build.sh

      - name: Run pyhmmer's tests and the filter regression test in Pyodide
        run: |
          npm install --no-audit --no-fund
          node test/run-tests.mjs dist/*.whl

      - name: Checksums
        run: (cd dist && sha256sum *.whl > SHA256SUMS && cat SHA256SUMS)

      - uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: dist/*

      - name: Publish a release for tags
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.whl dist/SHA256SUMS \
            --title "pyhmmer-pyodide $GITHUB_REF_NAME" \
            --notes "pyhmmer wheel for Pyodide, built and tested by CI. See the README for the patch and the test results."
